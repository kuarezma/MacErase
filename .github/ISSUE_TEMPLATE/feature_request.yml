name: Feature request
description: Suggest an improvement to MacErase.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe any workarounds or other approaches.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Add examples or mockups without personal information.
