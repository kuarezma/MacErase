name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run unit tests
        run: swift test
      - name: Build app
        env:
          APP_BUILD: ${{ github.run_number }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad tag: $GITHUB_REF_NAME"; exit 1; }
          APP_VERSION="$VERSION" zsh Scripts/build_app.sh
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent build/MacErase.app MacErase.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2.4.2
        with:
          files: MacErase.zip
          fail_on_unmatched_files: true
